name: contribution calendar

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render the calendar from the live contribution graph
        run: python tools/gen_calendar.py dist/contributions.svg

      # published to a side branch so the daily refresh never lands on main
      - name: push the result to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          committer: Niloy Bhuiyan <145592285+Niloy-Bhuiyan@users.noreply.github.com>
          author: Niloy Bhuiyan <145592285+Niloy-Bhuiyan@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
