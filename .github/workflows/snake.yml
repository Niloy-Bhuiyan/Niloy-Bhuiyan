name: contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: generate snake svg from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours are set explicitly rather than via `palette=`, which wins
          # over color_snake and leaves the snake at its default purple.
          outputs: |
            dist/snake-dark.svg?color_snake=#e8a33d&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#c17d1a&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: push the result to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          committer: Niloy Bhuiyan <145592285+Niloy-Bhuiyan@users.noreply.github.com>
          author: Niloy Bhuiyan <145592285+Niloy-Bhuiyan@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
